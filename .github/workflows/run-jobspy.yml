name: LinkedIn JobSpy public executor (CN HK SG lifecycle)

on:
  push:
    branches: [main]
    paths: [.github/workflows/run-jobspy.yml]
  workflow_dispatch:
    inputs:
      scope:
        description: "Manual scope when use_daily_plan is disabled"
        required: true
        default: cn
        type: choice
        options:
          - cn
          - expanded
      use_daily_plan:
        description: "Daily plan: 05/17 BJT CN/HK/SG lists only; 11/23 BJT CN lists plus non-target liveness. Disable for a manual scope run."
        required: true
        default: true
        type: boolean
      force_repost_jd:
        description: "One-time backfill: re-fetch JD for canonical rows already marked as repost"
        required: false
        default: false
        type: boolean

concurrency:
  group: linkedin-private-writer
  cancel-in-progress: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[executor-recovery]') }}

permissions:
  contents: read
  actions: read

jobs:
  recovery:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[executor-recovery]')
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Previous executor cancelled; the next scheduled dispatch uses the fixed version.'
  run-jobspy:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      LINKEDIN_HTTP_STATE: /tmp/linkedin-job-http-runtime.json
      LINKEDIN_HEALTH_EVENTS: /tmp/linkedin-health.jsonl
    defaults:
      run:
        working-directory: private-source
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: kobolibra/linkedin-jobs-page
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private-source
          fetch-depth: 0
      - name: Check required private-repository credential
        env:
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: test -n "$PRIVATE_REPO_TOKEN"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Resolve daily collection plan
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/jobspy/execution_plan.py \
            --daily-plan "${{ inputs.use_daily_plan }}" \
            --scope "${{ inputs.scope }}"
      - name: Initialize isolated health events and search outputs
        run: |
          mkdir -p data/jobspy/incremental/search
          rm -f data/jobspy/incremental/search/*.json
          rm -f data/jobspy/incremental/detail_results.json /tmp/linkedin-liveness.json
          python scripts/jobspy/scraper_health.py --state data/jobspy/http-state.json --initialize-runtime "$LINKEDIN_HTTP_STATE"
          : > "$LINKEDIN_HEALTH_EVENTS"
      - name: Search full company listings
        run: |
          case "${{ steps.plan.outputs.scope }}" in
            expanded)
              locations=(--location China --location "Hong Kong" --location Singapore)
              ;;
            cn)
              locations=(--location China)
              ;;
            *)
              echo "Unsupported scope: ${{ steps.plan.outputs.scope }}" >&2
              exit 1
              ;;
          esac
          python scripts/jobspy/run_company_searches.py \
            --output-dir data/jobspy/incremental/search \
            --results-per-company 1000 \
            --delay-min 2 \
            --delay-max 5 \
            --page-timeout 20 \
            --max-workers 2 \
            "${locations[@]}"
      - name: Combine search results
        id: combine
        run: |
          python scripts/jobspy/combine_search_results.py \
            --search-dir data/jobspy/incremental/search \
            --scope "${{ steps.plan.outputs.scope }}" \
            --output data/jobspy/incremental/search_combined.json
      - name: Report empty search and stop publishing
        if: steps.combine.outputs.has_jobs != 'true'
        run: |
          echo "::warning title=JobSpy incremental::No verified job observations or complete company snapshot are available. The previous snapshot is left untouched."
          echo "Nothing to publish; existing data/jobspy/incremental/latest.json remains the newest good snapshot."
      - name: Update persistent JobSpy history
        if: steps.combine.outputs.has_jobs == 'true'
        run: |
          python scripts/jobspy/update_jobspy_history.py \
            --snapshot data/jobspy/incremental/search_combined.json \
            --history data/jobspy/history/index.json
      - name: Select only new or JD-missing detail candidates
        if: steps.combine.outputs.has_jobs == 'true'
        run: |
          python - <<'PY'
          import json, re
          import sys
          from datetime import datetime, timezone
          sys.path.insert(0, "scripts/jobspy")
          from posting_dates import is_repost
          from linkedin_ids import linkedin_job_id
          def jid(x):
              return linkedin_job_id(x.get('sourceJobId') or x.get('link'))
          existing=json.load(open('jobs.json',encoding='utf-8'))
          existing=existing if isinstance(existing,list) else existing.get('jobs',[])
          old={jid(x):x for x in existing if jid(x)}
          incoming_doc=json.load(open('data/jobspy/incremental/search_combined.json',encoding='utf-8'))
          incoming=incoming_doc['jobs']
          observed=datetime.now(timezone.utc).isoformat()
          for item in incoming:
              item['jobspyRepost']=is_repost(old.get(jid(item), {}),item.get('datePosted'),observed)
          force_repost_jd='${{ inputs.force_repost_jd }}' == 'true'
          def repost_candidate(x):
              key=jid(x)
              previous=old.get(key, {})
              return is_repost(previous, x.get('datePosted'), observed)
          todo=[x for x in incoming if str(x.get('location') or '').upper() == 'CN' and (jid(x) not in old or not str(old[jid(x)].get('descriptionHtml') or '').strip() or repost_candidate(x) or (force_repost_jd and old.get(jid(x),{}).get('jobspyRepost') is True and old.get(jid(x),{}).get('jobStatus') != 'expired'))]
          json.dump({'schemaVersion':'1.1','mode':'detail-candidates','jobs':todo},open('data/jobspy/incremental/detail_candidates.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(incoming_doc,open('data/jobspy/incremental/search_combined.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('detail_candidates_cn',len(todo),'search_jobs_all_regions',len(incoming))
          PY
      - name: Fetch only new detail candidates
        if: steps.combine.outputs.has_jobs == 'true'
        run: |
          python scripts/jobspy/fetch_details_parallel.py \
            --input data/jobspy/incremental/detail_candidates.json \
            --output data/jobspy/incremental/detail_results.json \
            --workers 3 \
            --timeout 15 \
            --attempts 3 \
            --delay-min 1 \
            --delay-max 3
      - name: Probe non-target CN HK SG liveness and reposts
        if: steps.combine.outputs.has_jobs == 'true' && steps.plan.outputs.probe_liveness == 'true'
        continue-on-error: true
        run: |
          python scripts/jobspy/probe_job_liveness.py \
            --jobs jobs.json \
            --output /tmp/linkedin-liveness.json \
            --max-probes 150 \
            --min-interval-hours 20 \
            --gone-confirm-hours 12 \
            --delete-after-days 15 \
            --timeout 20 \
            --breaker 3 \
            --guard-ratio 0.6 \
            --guard-min 10 \
            --location CN \
            --location HK \
            --location SG
      - name: Combine search fields with fetched detail fields
        if: steps.combine.outputs.has_jobs == 'true'
        run: |
          python - <<'PY'
          import json, os, re
          import sys
          sys.path.insert(0, 'scripts/jobspy')
          from linkedin_ids import linkedin_job_id
          def jid(x):
              return linkedin_job_id(x.get('sourceJobId') or x.get('link'))
          base=json.load(open('data/jobspy/incremental/search_combined.json',encoding='utf-8'))
          detail_path='data/jobspy/incremental/detail_results.json'
          details={}
          if os.path.exists(detail_path):
              try:
                  details=json.load(open(detail_path,encoding='utf-8'))
              except Exception as exc:
                  print('detail_results unreadable, publishing search fields only:',exc,flush=True)
                  details={}
          else:
              print('detail_results missing (no detail candidates this run); publishing search fields only',flush=True)
          detail_rows=details.get('jobs',[]) if isinstance(details,dict) else details
          byid={jid(x):x for x in detail_rows if jid(x)}
          for x in base['jobs']:
              if jid(x) in byid: x.update(byid[jid(x)])
          base['detailsFetchedAt']=details.get('detailsFetchedAt') if isinstance(details,dict) else None
          json.dump(base,open('data/jobspy/incremental/latest.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          json.dump(base,open('data/jobspy/incremental/search_combined.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print('published_jobs',len(base['jobs']),'detail_results',len(detail_rows))
          PY
      - name: Publish immutable run metadata
        if: steps.combine.outputs.has_jobs == 'true'
        run: |
          date -u +%Y-%m-%dT%H:%M:%SZ > data/jobspy/incremental/latest.completed_at
      - name: Commit incremental snapshot
        if: steps.combine.outputs.has_jobs == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -s /tmp/linkedin-liveness.json ]]; then cp /tmp/linkedin-liveness.json data/jobspy/incremental/liveness.json; fi
          git add data/jobspy/incremental/latest.json data/jobspy/incremental/search_combined.json data/jobspy/incremental/latest.completed_at data/jobspy/history/index.json
          if [[ -s data/jobspy/incremental/liveness.json ]]; then git add data/jobspy/incremental/liveness.json; fi
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit"
            exit 0
          fi
          git commit -m "jobspy: publish snapshot for next canonical merge"
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:main"; then
              echo "Pushed snapshot on attempt ${attempt}"
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}; rebasing onto latest main"
            git fetch origin "main"
            if ! git rebase "origin/main"; then
              git rebase --abort || true
              echo "::error title=JobSpy incremental::Rebase onto main failed; snapshot not published"
              exit 1
            fi
            sleep $((attempt * 5))
          done
          echo "::error title=JobSpy incremental::Unable to push snapshot after 5 attempts"
          exit 1

      - name: Persist scraping health even when no job snapshot can be published
        if: always()
        env:
          JOBS_AVAILABLE: ${{ steps.combine.outputs.has_jobs }}
          WORKFLOW_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          detail_args=()
          if [[ "$JOBS_AVAILABLE" == 'true' ]]; then
            detail_args=(--details data/jobspy/incremental/detail_results.json --liveness /tmp/linkedin-liveness.json)
          fi
          python scripts/jobspy/scraper_health.py --task jobs --workflow-status "$WORKFLOW_STATUS" --search-dir data/jobspy/incremental/search "${detail_args[@]}" --snapshot /tmp/linkedin-job-health.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          published=false
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            health_rc=0
            python scripts/jobspy/scraper_health.py --apply /tmp/linkedin-job-health.json --state data/jobspy/http-state.json || health_rc=$?
            if [[ "$health_rc" != 0 && "$health_rc" != 2 ]]; then exit "$health_rc"; fi
            git add data/jobspy/health.json data/jobspy/http-state.json
            if git diff --cached --quiet; then published=true; break; fi
            git commit -m '[scraper-health] record requests and preserve cooldowns'
            if git push origin HEAD:main; then published=true; break; fi
            sleep $((attempt * 3))
          done
          if [[ "$published" != true ]]; then echo 'Unable to persist scraping health' >&2; exit 1; fi
          if [[ "$health_rc" == 2 ]]; then exit 1; fi
