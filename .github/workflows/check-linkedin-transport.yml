name: Compare original and current LinkedIn transport
on:
  push:
    branches: [diagnostics/transport-comparison]
    paths: [.github/workflows/check-linkedin-transport.yml, scripts/compare_linkedin_transport.py]
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check out last known successful private source
        uses: actions/checkout@v4
        with:
          repository: kobolibra/linkedin-jobs-page
          ref: 71517920c05bafc7e3641417f16572bddd97aac6
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: original
          persist-credentials: false
      - name: Check out repaired private source
        uses: actions/checkout@v4
        with:
          repository: kobolibra/linkedin-jobs-page
          ref: c13ace842f94b243bf49a5902c7491a01e43b1d6
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: current
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install requests beautifulsoup4
      - name: Compare eight requests at most without publishing job data
        run: python scripts/compare_linkedin_transport.py
